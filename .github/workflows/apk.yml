name: Costruisci APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ZIP_FILE=$(find . -name "Nexus-v*.zip" | sort -V | tail -1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -qo "$ZIP_FILE"
          else
            echo "Errore: Nessun file Nexus-v*.zip trovato"
            exit 1
          fi
      # Firma sempre con la stessa chiave: così ogni APK si installa sopra il precedente
      # senza disinstallare e senza perdere credenziali e dati.
      - name: Usa la chiave di firma fissa
        run: |
          mkdir -p ~/.android
          cp Nexus-firma/debug.keystore ~/.android/debug.keystore
      # Versione 11 / 1.1.0, per non essere vista come "downgrade" rispetto all'APK già installato
      - name: Imposta la versione
        run: |
          for f in Quaderno-github/app/build.gradle Quaderno-github/app/build.gradle.kts; do
            [ -f "$f" ] && sed -i -E 's/(versionCode[ =]+)[0-9]+/\111/; s/(versionName[ =]+")[^"]*"/\11.1.0"/' "$f"
          done
          true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compila APK con Gradle Wrapper
        run: |
          cd Quaderno-github
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Nexus-apk
          path: Quaderno-github/app/build/outputs/apk/debug/app-debug.apk
