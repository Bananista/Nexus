name: Costruisci APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trova e scompatta il pacchetto ovunque
        run: |
          echo "Contenuto iniziale del repository:"
          find . -maxdepth 3
          
          ZIP_FILE=$(find . -name "Nexus-v*.zip" | sort -V | tail -1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Trovato archivio: $ZIP_FILE"
            unzip -qo "$ZIP_FILE" -d extracted_content
            echo "Contenuto estratto:"
            ls -la extracted_content
          else
            echo "Nessun file Nexus-v*.zip trovato nel repository!"
          fi

      - name: Usa la chiave di firma fissa
        run: |
          mkdir -p ~/.android
          find . -name "debug.keystore" -exec cp {} ~/.android/debug.keystore \;

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Trova progetto, imposta versione e compila
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Errore: file settings.gradle non trovato nemmeno dopo l'estrazione!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Trovato progetto in: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          
          for f in app/build.gradle app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i -E 's/(versionCode[[:space:]]*=[[:space:]]*)[0-9]+/\1111/; s/(versionName[[:space:]]*=[[:space:]]*")[^"]+/\11.1.0/' "$f"
            fi
          done
          
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Nexus-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
