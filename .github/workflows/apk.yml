name: Costruisci APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Trova e scompatta il pacchetto
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "Nexus-v*.zip" | sort -V | tail -1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -qo "$ZIP_FILE"
          else
            echo "Nessun file Nexus-v*.zip trovato nella root."
          fi
          ls -la

      - name: Usa la chiave di firma fissa
        run: |
          mkdir -p ~/.android
          find . -name "debug.keystore" -exec cp {} ~/.android/debug.keystore \;

      - name: Imposta la versione
        run: |
          for f in Quaderno-github/app/build.gradle Quaderno-github/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i -E 's/(versionCode[[:space:]]*=[[:space:]]*)[0-9]+/\1111/; s/(versionName[[:space:]]*=[[:space:]]*")[^"]+/\11.1.0/' "$f"
            fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Esegui Gradle build
        run: gradle assembleDebug --no-daemon
        working-directory: Quaderno-github

      - uses: actions/upload-artifact@v4
        with:
          name: Nexus-apk
          path: Quaderno-github/app/build/outputs/apk/debug/app-debug.apk
